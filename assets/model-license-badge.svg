<svg xmlns="http://www.w3.org/2000/svg" width="180" height="20" viewBox="0 0 180 20" role="img" aria-labelledby="title">
  <title id="title">Model License: Apache-2.0</title>
  <linearGradient id="shade" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
    <stop offset="1" stop-opacity=".12"/>
  </linearGradient>
  <clipPath id="round"><rect width="180" height="20" rx="3"/></clipPath>
  <g clip-path="url(#round)">
